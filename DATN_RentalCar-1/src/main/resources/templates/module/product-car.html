<div th:fragment="product-car" class="container">
    <div class="product-layout">
        <h2 class="title-big">Xe Ô Tô Dành Cho Bạn</h2>
        <div class="product-list">

            <!-- Kiểm tra nếu danh sách xe ô tô trống -->
            <div th:if="${cars.size() == 0}" class="col-12">
                <p>No cars available</p>
            </div>

            <!-- Loop qua danh sách xe ô tô -->
            <div th:each="car, iterStat : ${cars}" 
                 th:if="${#strings.equals(car.status, 'Sẵn sàng') and iterStat.index < 8}" 
                 class="product-item">
                <a th:href="@{'/car/detail/' + ${car.carId}}" class="product-link">
                    <div class="product-img">
                        <img th:src="@{'/assets/images/car/' + ${#strings.arraySplit(car.imageUrl, ',')[0]}}" alt="Car Image" />
                        
                        <!-- Phần trăm giảm giá (nếu có) -->
                        <div th:if="${car.percentDiscount != null and car.percentDiscount > 0}" class="product-discount">
                            Giảm <span th:text="${car.percentDiscount + '%'}"></span>
                        </div>

                        <div class="product-rents">
                            <span class="product-rent">
                                Miễn thế chấp 
                                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"
                                     xmlns="http://www.w3.org/2000/svg">
                                    <!-- SVG content -->
                                    <path d="M2.06654 3.41201L3.30916 4.68289C3.50222 4.88033 3.81878 4.88389 4.01622 4.69084C4.21367 4.49778 4.21723 4.18122 4.02417 3.98378L2.73171 2.66192C4.08658 1.32458 5.9467 0.5 7.99999 0.5C12.1421 0.5 15.5 3.8579 15.5 8.00004C15.5 10.0709 14.6612 11.9454 13.3035 13.3031L11.9871 11.9806C11.7923 11.7849 11.4757 11.7842 11.28 11.979C11.0843 12.1738 11.0836 12.4904 11.2784 12.6861L12.5495 13.9631C11.2875 14.9276 9.71111 15.5001 7.99999 15.5001C3.85785 15.5001 0.5 12.1422 0.5 8.00004C0.5 6.27151 1.08422 4.68039 2.06654 3.41201Z"
                                          stroke="#5FCF86" stroke-linecap="round" stroke-linejoin="round"></path>
                                </svg>
                            </span>
                        </div>
                    </div>

                    <!-- Thẻ sản phẩm -->
                    <div class="product-tags">
                        <div th:text="${car.gearBox}" class="product-tag"></div>
                        <div class="product-tag">Giao xe tận nơi</div>
                    </div>

                    <!-- Tên xe -->
                    <div th:text="${car.make + ' ' + car.model + ' ' + car.year}" class="product-title"></div>

                    <!-- Địa điểm -->
                    <div class="product-location">
                        <div class="wrap-svg">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="17" viewBox="0 0 16 17" fill="none">
                                <!-- SVG content -->
                            </svg>
                        </div>
                        Huyện Đức Trọng, Lâm Đồng
                    </div>

                    <!-- Phân cách -->
                    <div class="product-line"></div>

                    <!-- Giá thuê và chi tiết -->
                    <div class="product-bottom">
                        <div th:text="${car.rentals != null ? car.rentals + ' chuyến' : 'Chưa có chuyến'}" class="product-ship"></div>
                        
                        <div class="product-price">
                            <!-- Giá gốc, chỉ hiển thị khi có giảm giá -->
                            <div th:if="${car.percentDiscount != null and car.percentDiscount > 0}" class="old-price">
                                <span th:text="${#numbers.formatInteger(car.dailyRate, 3, 'POINT') + 'đ'}"></span>
                            </div>

                            <!-- Giá mới sau khi giảm -->
                            <div class="new-price">
                                <span th:text="${#numbers.formatInteger(car.dailyRate * (1 - (car.percentDiscount / 100)), 3, 'POINT') + 'đ'}"></span>
                                <span>/</span>
                                <p>ngày</p>
                            </div>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </div>
</div>
