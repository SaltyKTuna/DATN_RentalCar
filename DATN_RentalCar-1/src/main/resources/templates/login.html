<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="./assets/css/Login.css">
</head>

<body>
    <section class="vh-100">
        <div class="container-fluid h-custom">
            <span id="back-arrow" class="back-arrow">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 18l-6-6 6-6" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span class="back-text">Back</span>
            </span>

            <div class="row d-flex justify-content-center align-items-center h-100">
                <div class="col-md-9 col-lg-6 col-xl-5 img-container">

                    <img src="./assets/images/others/LoginLogo.png" class="img-fluid" alt="Sample image">
                </div>
                
                <div class="col-md-8 col-lg-6 col-xl-4 offset-xl-1">
                    <!-- Form Đăng Nhập -->
					<form id="login-form" class="btn-login" action="/login" method="POST">
					    <h1 class="title-login">ĐĂNG NHẬP</h1>
					
					    <!-- Email input -->
					    <div class="form-outline mb-4">
					        <label class="form-label" for="loginEmail">Email:</label>
					        <input type="email" id="loginEmail" name="email" class="form-control form-control-lg" placeholder="Nhập địa chỉ Email" required  value="rentalcar@gmail.com"/>
					    </div>
					
					    <!-- Password input -->
					    <div class="form-outline mb-3">
					        <label class="form-label" for="loginPassword">Mật Khẩu:</label><br>
					        <input type="password" id="loginPassword" name="password" class="form-control form-control-lg" placeholder="Nhập Password" required  value="123"/>
					    </div>
					
					    <div class="d-flex justify-content-between align-items-center">
					        <a href="/forgotPassword" class="text-body">Quên Mật Khẩu?</a>
					    </div>
					    
						 <!-- Error message -->
					    <p th:if="${error}" style="color:red;" th:text="${error}"></p>
					    
					    <div class="text-center text-lg-start mt-4 pt-2">
					        <button type="submit" class="btn btn-primary btn-lg">Đăng Nhập</button>
					        <p class="small fw-bold mt-2 pt-1 mb-0">Bạn chưa có tài khoản? 
					        <a href="/register"
						class="register-link">Đăng ký</a></p>
					    </div>
					</form>
                  </div>
                  
            </div>
        </div>
        
    </section>
    <script src="assets/js/register.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
