<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác nhận chuyển hướng</title>
    <script>
        // Hàm xác nhận chuyển hướng
        function confirmRedirect() {
		    const role = document.body.dataset.role;
		    const redirectUrl = document.body.dataset.redirectUrl;
		
		    // Chỉ hiển thị xác nhận nếu role là "admin"
		    if (role === "admin") {
		        const message = "Bạn đang truy cập trang quản trị. Bạn có chắc chắn muốn tiếp tục?";
		        if (confirm(message)) {
		            window.location.href = redirectUrl; // Đến trang admin
		        } else {
		            window.location.href = "http://localhost:8080"; // Quay về trang khách hàng
		        }
		    } else {
		        window.location.href = "http://localhost:8080"; // Nếu không phải admin, về trang khách hàng luôn
		    }
		}

    </script>
</head>
<body data-role="${role}" data-redirect-url="${redirectUrl}" onload="confirmRedirect()">
    <p>Đang xử lý... Vui lòng chờ.</p>
    <script>
        console.log("Role:", document.body.dataset.role);
        console.log("Redirect URL:", document.body.dataset.redirectUrl);
    </script>
</body>
</html>
