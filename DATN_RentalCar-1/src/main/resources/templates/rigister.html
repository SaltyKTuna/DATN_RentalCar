<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rigister RENTALCAR</title>
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link rel="stylesheet"
	href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
<link rel="stylesheet" href="./assets/css/rigister.css">
</head>

<body>
	<section class="vh-100">
		<div class="container-fluid h-custom">
			<div class="container-fluid h-custom">
				<span id="back-arrow" class="back-arrow"> <svg width="24"
						height="24" viewBox="0 0 24 24" fill="none"
						xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 18l-6-6 6-6" stroke="#000"
							stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg> <span class="back-text">Back</span>
				</span>

				<div
					class="row d-flex justify-content-center align-items-center h-100">
					<div class="col-md-9 col-lg-6 col-xl-5 img-container">
						<img src="./assets/images/others/LoginLogo.png" class="img-fluid"
							alt="Sample image">
					</div>

					<div class="col-md-8 col-lg-6 col-xl-4 offset-xl-1">
						<!-- Form Đăng Ký -->
						<form id="register-form" class="btn-register"
							th:action="@{/register}" method="POST" th:object="${account}">
							<h1 class="title-register">ĐĂNG KÝ</h1>

							<!-- Name input -->
							<div class="form-outline mb-4">
								<label class="form-label" for="registerName">Họ và Tên:</label>
								<input type="text" id="registerName" th:field="*{fullName}"
									class="form-control form-control-lg"
									placeholder="Nhập họ và tên" required />
							</div>
							
							<!-- numberphone input -->
							<div class="form-outline mb-4">
								<label class="form-label" for="registerName">Số Điện Thoại: </label>
								<input type="text" id="registerName" th:field="*{phoneNumber}"
									class="form-control form-control-lg"
									placeholder="Nhập số điện thoại" required />
									<!-- Thông báo -->
							    <span th:if="${SDTError}" class="error-message">
							        <p th:text="${SDTError}" style="color:red;"></p>
							    </span>
							</div>

							<!-- Email input -->
							<div class="form-outline mb-4">
								<label class="form-label" for="registerEmail">Email:</label> <input
									type="email" id="registerEmail" th:field="*{email}"
									class="form-control form-control-lg"
									placeholder="Nhập địa chỉ Email" required />
									
								<!-- Thông báo -->
							    <span th:if="${EmailError}" class="error-message">
							        <p th:text="${EmailError}" style="color:red;"></p>
							    </span>
							</div>

							<!-- Username input -->
							<div class="form-outline mb-4">
								<label class="form-label" for="registerUsername">Tên
									Tài Khoản:</label> <input type="text" id="registerUsername"
									th:field="*{username}" class="form-control form-control-lg"
									placeholder="Nhập tên tài khoản" required />
							</div>

							<!-- Password input -->
							<div class="form-outline mb-3">
								<label class="form-label" for="registerPassword">Mật
									Khẩu:</label><br> <input type="password" id="registerPassword"
									th:field="*{passwordHash}" class="form-control form-control-lg"
									placeholder="Nhập mật khẩu" required />
							</div>
							
							<!-- Thông báo -->
						    <div th:if="${error}" class="error-message">
						        <p th:text="${error}" style="color:red;"></p>
						    </div>
						    <div th:if="${success}" class="success-message">
						        <p th:text="${success}" style="color:green;"></p>
						    </div>
						    

							<div class="text-center text-lg-start mt-4 pt-2">
								<button type="submit" class="btn btn-primary btn-lg"
									style="padding-left: 2.5rem; padding-right: 2.5rem;">Đăng
									Ký</button>
								<p class="small fw-bold mt-2 pt-1 mb-0">
									Bạn đã có tài khoản? 
									<a href="/login" class="link-danger">
									Đăng nhập
									</a>
								</p>
							</div>	
							
						</form>
					

					</div>

				</div>
				</div>
			</div>
	</section>
	<script src="./assets/js/"></script>
	<script src="./assets/js/register.js"></script>
	<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
